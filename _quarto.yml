project:
  type: website
  output-dir: docs        # GitHub Pages serves from /docs on the main branch
  resources:              # copied into docs/ on every render
    - CNAME               # tells GitHub Pages your custom domain
    - .nojekyll           # stops GitHub from re-processing the built site
    - robots.txt
    - cv.pdf

website:
  title: "Gabriella Aboulafia"
  site-url: https://gaboulafia.com     # lets Quarto build sitemap.xml
  description: >-
    Gabriella (Gaby) Aboulafia is a PhD candidate in Health Policy at Harvard
    University studying Medicaid, Medicare, and the Affordable Care Act's
    Marketplaces, and how experiences with health insurance shape political
    attitudes and behavior.
  image: profile.jpg                   # thumbnail in link previews
  open-graph: true                     # link previews on Bluesky, Slack, etc.
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: teaching.qmd
        text: Teaching
      - href: cv.pdf
        text: CV

format:
  html:
    theme: [cosmo, theme.scss]   # cosmo as the base, theme.scss for fonts
    css: styles.css
    toc: false
    include-in-header: head.html # schema.org Person markup
